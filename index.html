<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solar Panels in Holm, Orkney</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="brand">Solar Panels in Holm, Orkney</a>
  <div class="links">
    <a href="index.html" class="active">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
  </div>
</nav>

<main>

  <div class="period-toggle">
    <button data-period="day" class="active">Day</button>
    <button data-period="month">Month</button>
    <button data-period="year">Year</button>
    <button data-period="lifetime">Lifetime</button>
  </div>

  <div class="period-nav" id="period-nav">
    <div class="nav-group">
      <button id="nav-prev" class="nav-arrow">&#8249;</button>
      <span id="period-label"></span>
      <button id="nav-next" class="nav-arrow">&#8250;</button>
    </div>
    <span class="period-total" id="period-total"></span>
  </div>

  <div class="chart-card">
    <img id="day-image" src="" alt="" style="display:none;">
    <canvas id="chart"></canvas>
  </div>
</main>

<script src="overview.js"></script>
</body>
</html>
