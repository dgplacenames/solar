name: Backfill historical data

# Manual-only. Run once from the Actions tab to fill in every day from
# install date (or a chosen start date) up to yesterday, posting each
# to Mastodon - see backfill.py.

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date YYYY-MM-DD (blank = install date, 2026-08-12)'
        required: false

permissions:
  contents: write

concurrency:
  group: solar-data-write
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run backfill
        env:
          SOLIS_KEY_ID: ${{ secrets.SOLIS_KEY_ID }}
          SOLIS_KEY_SECRET: ${{ secrets.SOLIS_KEY_SECRET }}
          SOLIS_INVERTER_ID: ${{ secrets.SOLIS_INVERTER_ID }}
          SOLIS_INVERTER_SN: ${{ secrets.SOLIS_INVERTER_SN }}
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.start_date }}" ]; then
            python backfill.py "${{ github.event.inputs.start_date }}"
          else
            python backfill.py
          fi

      - name: Commit and push if anything changed
        run: |
          git config user.name "solar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add images data archive
          git diff --cached --quiet || git commit -m "Backfill solar data"
          git push
